<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast | Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <!-- Search Header -->
        <header class="search-header">
            <h1>SkyCast 🌤️</h1>
            <div class="search-box">
                <input type="text" id="city-input" placeholder="Search city (e.g., London, Tokyo)...">
                <button id="search-btn">Search</button>
            </div>
        </header>

        <!-- Main Dashboard Content -->
        <main id="dashboard" class="dashboard hidden">
            <!-- Current Weather Card -->
            <section class="current-weather">
                <div class="weather-info">
                    <h2 id="city-name">City Name</h2>
                    <p id="current-date">Date</p>
                    <div class="temp-box">
                        <span id="temperature">--</span>°C
                    </div>
                    <p id="weather-condition">Condition</p>
                </div>
                <div class="weather-details">
                    <p>Humidity: <span id="humidity">--</span>%</p>
                    <p>Wind Speed: <span id="wind-speed">--</span> km/h</p>
                </div>
            </section>

            <!-- 5-Day Forecast -->
            <section class="forecast-section">
                <h3>5-Day Forecast</h3>
                <div id="forecast-container" class="forecast-grid">
                    <!-- Forecast cards injected via JavaScript -->
                </div>
            </section>
        </main>

        <!-- Error Message -->
        <div id="error-message" class="error-hidden">
            <p>City not found. Please try another location.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
